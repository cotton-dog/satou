<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>satou</title>

<link rel="manifest" href="./manifest.webmanifest">

<link rel="icon"
type="image/png"
href="https://i.imgs.ovh/2026/09/02/5fd685cc628af5558ac9b6ee3668867c.png">

<link rel="apple-touch-icon"
href="https://i.imgs.ovh/2026/09/02/5fd685cc628af5558ac9b6ee3668867c.png">

<meta name="apple-mobile-web-app-title" content="satou">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#eeeeee">


<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/phone-frame.css">
<link rel="stylesheet" href="./css/status-bar.css">
<link rel="stylesheet" href="./css/lock-screen.css">

</head>


<body>

<!-- ==================================================
     SATOU PHONE
================================================== -->

<div class="phone">

    <!-- 左侧实体键 -->

    <div class="side-switch"></div>

    <div class="volume-up"></div>

    <div class="volume-down"></div>


    <!-- 右侧电源键 -->

    <div class="power-button"></div>


    <!-- 手机黑色边框 -->

    <div class="phone-frame">

        <!-- 手机屏幕 -->

        <div class="screen">

            <!--
                SATOU 所有手机界面
                都写在这里
            -->

            <div class="screen-content" id="screen-content">

                <!-- 当前页面由 JS 加载 -->

            </div>


            <!-- 灵动岛 -->

            <div class="dynamic-island"></div>

        </div>

    </div>

</div>


<script src="./js/wallpaper.js"></script>
<script src="./js/status-bar.js"></script>
<script src="./js/battery.js"></script>
<script src="./js/lunar.js"></script>
<script src="./js/lock-screen.js"></script>
<script src="./js/app.js"></script>


</body>
</html>
