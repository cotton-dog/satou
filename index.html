<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>satou</title>

<!-- =========================
     PWA
========================= -->

<link rel="manifest" href="./manifest.webmanifest">

<link rel="icon"
type="image/png"
href="https://i.imgs.ovh/2026/09/02/5fd685cc628af5558ac9b6ee3668867c.png">

<link rel="apple-touch-icon"
href="https://i.imgs.ovh/2026/09/02/5fd685cc628af5558ac9b6ee3668867c.png">

<meta name="apple-mobile-web-app-title" content="satou">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#eeeeee">


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#eeeeee;

    display:flex;
    align-items:center;
    justify-content:center;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}


/* =========================
   手机最外层
========================= */

.phone{
    position:relative;

    width:min(390px,88vw);
    height:min(770px,91vh);

    border-radius:60px;
    padding:5px;

    background:
    linear-gradient(
        145deg,
        #eeeeee 0%,
        #bdbdbd 10%,
        #f7f7f7 20%,
        #9b9b9b 55%,
        #ededed 88%,
        #a5a5a5 100%
    );

    box-shadow:
    0 18px 38px rgba(0,0,0,.16),
    0 4px 12px rgba(0,0,0,.12),
    inset 1px 0 1px rgba(255,255,255,.85),
    inset -1px 0 2px rgba(0,0,0,.25);
}


/* =========================
   黑色手机边框
========================= */

.phone-frame{
    position:relative;

    width:100%;
    height:100%;

    padding:8px;

    border-radius:56px;

    background:
    linear-gradient(
        145deg,
        #171717 0%,
        #050505 25%,
        #000 55%,
        #080808 78%,
        #191919 100%
    );

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.15),
    inset 0 -2px 4px rgba(0,0,0,.9),
    0 0 0 1px rgba(0,0,0,.8);
}


/* =========================
   屏幕
========================= */

.screen{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:48px;

    background:#fff;

    box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.3);
}


/* =========================
   Satou 手机内容区域
========================= */

.screen-content{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    /*
       以后这里放：

       ① 锁屏
       ② 手机桌面
       ③ App
       ④ App 内页面
       ⑤ 状态栏
       ⑥ 壁纸
    */
}


/* =========================
   Dynamic Island
========================= */

.dynamic-island{
    position:absolute;

    z-index:100;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    width:60px;
    height:18px;

    border-radius:30px;

    background:
    linear-gradient(
        180deg,
        #050505 0%,
        #000 55%,
        #111 100%
    );

    box-shadow:
    inset 0 1px 2px rgba(255,255,255,.07),
    0 1px 2px rgba(0,0,0,.3);
}


/* 灵动岛镜头 */

.dynamic-island::after{
    content:"";

    position:absolute;

    width:4px;
    height:4px;

    right:7px;
    top:7px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 30%,
        #303030 0%,
        #111 45%,
        #000 100%
    );
}


/* =========================
   左侧静音键
========================= */

.side-switch,
.volume-up,
.volume-down{
    position:absolute;

    z-index:200;

    left:-5px;

    width:4px;

    border-radius:3px 0 0 3px;

    background:
    linear-gradient(
        90deg,
        #888,
        #d0d0d0,
        #999
    );

    box-shadow:
    -1px 0 1px rgba(0,0,0,.25);
}

.side-switch{
    top:137px;
    height:27px;
}

.volume-up{
    top:194px;
    height:54px;
}

.volume-down{
    top:260px;
    height:54px;
}


/* =========================
   右侧电源键
========================= */

.power-button{
    position:absolute;

    z-index:200;

    right:-5px;
    top:212px;

    width:4px;
    height:88px;

    border-radius:0 3px 3px 0;

    background:
    linear-gradient(
        90deg,
        #929292,
        #d0d0d0,
        #929292
    );

    box-shadow:
    1px 0 1px rgba(0,0,0,.25);
}


/* =========================
   手机端适配
========================= */

@media(max-width:500px){

    .phone{
        width:92vw;
        height:90vh;

        border-radius:51px;
        padding:4px;
    }

    .phone-frame{
        border-radius:47px;
        padding:7px;
    }

    .screen{
        border-radius:40px;
    }

    .dynamic-island{
        top:14px;
    }

    .side-switch{
        top:120px;
    }

    .volume-up{
        top:170px;
        height:49px;
    }

    .volume-down{
        top:230px;
        height:49px;
    }

    .power-button{
        top:190px;
        height:82px;
    }
}


/* =========================
   PWA 安全区域
========================= */

@supports(padding:env(safe-area-inset-top)){

    .screen-content{
        padding-top:env(safe-area-inset-top);
        padding-bottom:env(safe-area-inset-bottom);
    }
}

</style>
</head>


<body>

<!-- ==================================================
     SATOU PHONE
================================================== -->

<div class="phone">

    <!-- 左侧实体键 -->

    <div class="side-switch"></div>

    <div class="volume-up"></div>

    <div class="volume-down"></div>


    <!-- 右侧电源键 -->

    <div class="power-button"></div>


    <!-- 手机黑色边框 -->

    <div class="phone-frame">

        <!-- 手机屏幕 -->

        <div class="screen">

            <!--
                SATOU 所有手机界面
                都写在这里
            -->

            <div class="screen-content">

                <!-- 锁屏 / 桌面 / App
                     后面从这里开始写 -->

            </div>


            <!-- 灵动岛 -->

            <div class="dynamic-island"></div>

        </div>

    </div>

</div>


<script>

/* =========================
   Service Worker
========================= */

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker
        .register("./sw.js")
        .then(()=>{
            console.log("satou PWA 已启动");
        })
        .catch(error=>{
            console.log("Service Worker 注册失败",error);
        });

    });

}


/* =========================
   禁止手势缩放
========================= */

document.addEventListener(
    "gesturestart",
    event=>event.preventDefault()
);


/* =========================
   禁止双击缩放
========================= */

let lastTouchEnd=0;

document.addEventListener(
    "touchend",
    event=>{

        const now=Date.now();

        if(now-lastTouchEnd<=300){
            event.preventDefault();
        }

        lastTouchEnd=now;

    },
    false
);

</script>

</body>
</html>
