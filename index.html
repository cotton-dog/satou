<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>satou</title>


<!-- =========================
     SATOU PWA
========================= -->

<link rel="manifest"
      href="./manifest.webmanifest">

<!-- 网站图标 -->
<link rel="icon"
      type="image/png"
      href="./icons/icon-192.png">

<!-- 添加到 iPhone 主屏幕 -->
<link rel="apple-touch-icon"
      href="./icons/icon-192.png">

<meta name="apple-mobile-web-app-title"
      content="satou">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="theme-color"
      content="#050507">


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    user-select:none;
    -webkit-user-select:none;

    -webkit-tap-highlight-color:
        transparent;
}


/* =========================
   手机整体
========================= */

.phone{

    position:relative;

    width:min(96vw,430px);

    height:min(96vh,860px);

    max-width:calc(100vw - 14px);

    max-height:calc(100vh - 14px);

    aspect-ratio:430 / 860;

    border-radius:58px;


    /* 外层金属边 */

    background:
        linear-gradient(
            135deg,
            #8c8a91 0%,
            #3b3940 8%,
            #111116 20%,
            #29272d 50%,
            #09090d 80%,
            #74717a 100%
        );

    padding:7px;


    /* 立体边缘 */

    box-shadow:

        0 0 0 1px #aaa7ae,

        0 0 0 3px #4d4a51,

        0 12px 30px
        rgba(0,0,0,.20),

        inset 1px 1px 2px
        rgba(255,255,255,.45),

        inset -2px -2px 4px
        rgba(0,0,0,.85);

    overflow:visible;
}


/* =========================
   黑色内边框
========================= */

.bezel{

    position:relative;

    width:100%;
    height:100%;

    border-radius:52px;

    background:#050507;

    padding:
        21px
        14px
        18px;


    box-shadow:

        inset 0 1px 2px
        rgba(255,255,255,.18),

        inset 0 -2px 4px
        rgba(0,0,0,.9);
}


/* =========================
   屏幕
========================= */

.screen{

    position:relative;

    width:100%;
    height:100%;

    background:#ffffff;

    border-radius:43px;

    overflow:hidden;


    box-shadow:

        inset 0 0 0 1px
        rgba(0,0,0,.08),

        inset 0 0 8px
        rgba(0,0,0,.08);
}


/* =========================
   Satou 手机内容区域
========================= */

.screen-content{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#ffffff;

    z-index:1;
}


/* =========================
   顶部药丸
========================= */

.dynamic-island{

    position:absolute;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    width:116px;

    height:32px;

    border-radius:20px;


    background:
        linear-gradient(
            145deg,
            #020202,
            #090909 55%,
            #000000
        );


    box-shadow:

        0 1px 2px
        rgba(255,255,255,.08),

        inset 0 -1px 2px
        rgba(255,255,255,.03);

    z-index:100;
}


/* =========================
   摄像头
========================= */

.camera{

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    width:12px;

    height:12px;

    border-radius:50%;


    background:
        radial-gradient(
            circle at 35% 30%,
            #374a9b 0%,
            #111c56 30%,
            #02030a 65%,
            #000 100%
        );


    box-shadow:

        0 0 0 1px #101018,

        inset 0 0 2px
        rgba(255,255,255,.45);
}


/* =========================
   摄像头高光
========================= */

.camera::after{

    content:"";

    position:absolute;

    width:3px;

    height:3px;

    left:3px;

    top:2px;

    border-radius:50%;

    background:
        rgba(255,255,255,.5);
}


/* =========================
   顶部外壳细节
========================= */

.top-detail{

    position:absolute;

    top:-2px;

    left:50%;

    transform:translateX(-50%);

    width:88px;

    height:4px;

    border-radius:
        0 0 5px 5px;

    background:#242329;


    box-shadow:

        inset 0 -1px 1px
        rgba(0,0,0,.8),

        0 1px 1px
        rgba(255,255,255,.12);

    z-index:200;
}


/* =========================
   左侧按键
========================= */

.left-button{

    position:absolute;

    left:-5px;

    width:5px;

    border-radius:
        4px 0 0 4px;


    background:
        linear-gradient(
            90deg,
            #77747b,
            #29272d,
            #111116
        );


    box-shadow:

        -1px 1px 2px
        rgba(0,0,0,.5),

        inset 1px 0
        rgba(255,255,255,.35);

    z-index:300;
}


/* 静音键 */

.silent{

    top:106px;

    height:43px;
}


/* 音量+ */

.volume-up{

    top:212px;

    height:67px;
}


/* 音量- */

.volume-down{

    top:291px;

    height:67px;
}


/* =========================
   右侧电源键
========================= */

.power-button{

    position:absolute;

    right:-5px;

    top:260px;

    width:5px;

    height:72px;

    border-radius:
        0 4px 4px 0;


    background:
        linear-gradient(
            90deg,
            #111116,
            #29272d,
            #77747b
        );


    box-shadow:

        1px 1px 2px
        rgba(0,0,0,.5),

        inset -1px 0
        rgba(255,255,255,.35);

    z-index:300;
}


/* =========================
   手机外壳高光
========================= */

.phone::before{

    content:"";

    position:absolute;

    inset:1px;

    border-radius:57px;

    pointer-events:none;

    border:
        1px solid
        rgba(255,255,255,.20);

    z-index:500;
}


/* =========================
   小屏幕
========================= */

@media(max-width:360px){

    .phone{

        width:calc(100vw - 10px);

        height:calc(100vh - 10px);

        border-radius:45px;

        padding:5px;
    }


    .bezel{

        border-radius:40px;

        padding:
            16px
            11px
            14px;
    }


    .screen{

        border-radius:33px;
    }


    .dynamic-island{

        top:14px;

        width:100px;

        height:29px;
    }


    .silent{

        top:80px;

        height:35px;
    }


    .volume-up{

        top:170px;

        height:52px;
    }


    .volume-down{

        top:232px;

        height:52px;
    }


    .power-button{

        top:210px;

        height:58px;
    }

}


/* =========================
   矮屏设备
========================= */

@media(max-height:500px){

    .phone{

        height:calc(100vh - 8px);

        width:auto;

        aspect-ratio:430 / 860;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     SATOU
================================================== -->

<div class="phone">


    <!-- 顶部外壳细节 -->

    <div class="top-detail"></div>


    <!-- 左侧实体按键 -->

    <div class="left-button silent"></div>

    <div class="left-button volume-up"></div>

    <div class="left-button volume-down"></div>


    <!-- 右侧电源键 -->

    <div class="power-button"></div>


    <!-- 黑色内边框 -->

    <div class="bezel">


        <!-- 屏幕 -->

        <div class="screen">


            <!--
                SATOU 手机系统内容

                以后所有桌面、锁屏、App
                都放在这个区域
            -->

            <div class="screen-content">

            </div>


            <!-- 顶部药丸 -->

            <div class="dynamic-island">

                <div class="camera"></div>

            </div>


        </div>


    </div>


</div>



<script>

/* ==================================================
   SATOU PWA
================================================== */


/* =========================
   Service Worker
========================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register("./sw.js", {
                    scope:"./"
                })
                .then(function(){

                    console.log(
                        "satou PWA 已启动"
                    );

                })
                .catch(function(error){

                    console.error(
                        "satou Service Worker 错误:",
                        error
                    );

                });

        }
    );

}


/* =========================
   禁止双指缩放
========================= */

document.addEventListener(
    "gesturestart",
    function(event){

        event.preventDefault();

    }
);


/* =========================
   防止双击缩放
========================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function(event){

        const now = Date.now();

        if(now - lastTouchEnd <= 300){

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    false
);

</script>


</body>

</html>
